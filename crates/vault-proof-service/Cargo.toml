[package]
name = "beatex-vault-proof-service"
version = "0.1.0"
description = "Offchain Token-2022 vault proof generation for BeatEx"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
beatex-program = { path = "../../programs/beatex", features = ["no-entrypoint"] }
beatex-babyjubjub-groth16-spike = { path = "../babyjubjub-groth16-spike" }
beatex-threshold-crypto = { path = "../threshold-crypto" }
ark-ed-on-bn254 = "=0.5.0"
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
curve25519-dalek.workspace = true
solana-zk-sdk.workspace = true
solana-zk-sdk-pod = "=0.1.2"
solana-zk-elgamal-proof-interface = "=0.1.3"
solana-instruction = "=3.5.1"
solana-pubkey = "=3.0.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
spl-token-confidential-transfer-proof-generation = "=0.6.1"
thiserror.workspace = true
zeroize.workspace = true
rand.workspace = true

[dev-dependencies]
rand.workspace = true
anchor-lang = "=1.1.2"
ark-snark = "=0.5.1"
litesvm = "=0.10.0"
rand_chacha = "=0.3.1"
solana-account = "=3.4.0"
solana-compute-budget-interface = "=3.1.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-zk-sdk-pod = "=0.1.2"
spl-token-2022-interface = "=3.0.0"
