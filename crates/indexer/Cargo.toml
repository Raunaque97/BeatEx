[package]
name = "beatex-indexer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anchor-lang = "=1.1.2"
axum = "0.8.6"
beatex-program = { path = "../../programs/beatex", features = ["no-entrypoint"] }
bs58 = "0.5.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["set-header"] }
