[package]
name = "beatex-market-maker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anchor-lang = "=1.1.2"
base64 = "0.22.1"
beatex-devnet-client = { path = "../devnet-client", default-features = false }
beatex-program = { path = "../../programs/beatex", features = ["no-entrypoint"] }
ctrlc = "3.4.7"
pyth-solana-receiver-sdk = "=2.0.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.0"
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros"] }
