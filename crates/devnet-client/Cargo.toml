[package]
name = "beatex-devnet-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["browser-wallet"]
browser-wallet = []

[dependencies]
anchor-lang = "=1.1.2"
base64 = "0.22.1"
bincode = "1.3.3"
beatex-babyjubjub-groth16-spike = { path = "../babyjubjub-groth16-spike" }
beatex-program = { path = "../../programs/beatex", features = ["no-entrypoint"] }
beatex-threshold-crypto = { path = "../threshold-crypto" }
beatex-vault-proof-service = { path = "../vault-proof-service" }
ark-bn254 = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-snark = "=0.5.1"
rand_chacha = "=0.3.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
solana-compute-budget-interface = "=3.1.0"
solana-hash = "=3.1.0"
solana-instruction = "=3.5.1"
solana-instructions-sysvar = "=3.0.1"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = { version = "=3.1.0", features = ["bincode"] }
solana-zk-sdk.workspace = true
solana-zk-sdk-pod = "=0.1.2"
solana-address-v1 = { package = "solana-address", version = "=2.8.0" }
solana-hash-v1 = { package = "solana-hash", version = "=4.7.0" }
solana-instruction-v1 = { package = "solana-instruction", version = "=4.0.0" }
solana-keypair-v1 = { package = "solana-keypair", version = "=4.0.0" }
solana-message-v1 = { package = "solana-message", version = "=5.1.0", features = ["wincode"] }
solana-signer-v1 = { package = "solana-signer", version = "=4.0.0" }
solana-transaction-v1 = { package = "solana-transaction", version = "=5.1.0", features = ["wincode"] }
spl-token-2022-interface = "=3.0.0"
time = { version = "=0.3.55", features = ["local-offset"] }
wincode = "=0.6.0"
