[package]
name = "beatex-browser-prover-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Browser-local Arkworks Groth16 benchmark for BeatEx order arithmetic"

# Keep this experiment isolated from the repository workspace and lockfile.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-r1cs-std = "=0.5.0"
ark-serialize = "=0.5.0"
ark-snark = "=0.5.1"
curve25519-dalek = { version = "=4.1.3", features = ["digest", "rand_core"] }
js-sys = "=0.3.77"
getrandom = { version = "=0.2.17", features = ["js"] }
rand = "=0.8.6"
rand_chacha = "=0.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
sha3 = "=0.10.8"
wasm-bindgen = "=0.2.100"
web-sys = { version = "=0.3.77", features = ["Performance", "Window"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
