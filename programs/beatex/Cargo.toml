[package]
name = "beatex-program"
version = "0.1.0"
description = "Confidential frequent batch auctions on Solana"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "beatex"

[features]
default = []
anchor-debug = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
sbf-test-fixtures = []

[dependencies]
anchor-lang = "=1.1.2"
groth16-solana = "=0.2.0"
solana-curve25519 = "=3.1.10"
solana-poseidon = "=3.1.10"
solana-sha256-hasher = "=3.1.0"
solana-zk-elgamal-proof-interface = "=0.1.3"
solana-zk-sdk-pod = "=0.1.2"
spl-token-2022-interface = "=3.0.0"
spl-token-confidential-transfer-proof-extraction = "=0.6.1"

[dev-dependencies]
ark-ff = "=0.5.0"
beatex-babyjubjub-groth16-spike = { path = "../../crates/babyjubjub-groth16-spike" }
beatex-threshold-crypto = { path = "../../crates/threshold-crypto" }
litesvm = "=0.10.0"
solana-account = "=3.4.0"
solana-compute-budget-interface = "=3.1.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-zk-sdk = "=7.0.1"

[build-dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
curve25519-dalek = "=4.1.3"
rand = "=0.8.6"
rand_chacha = "=0.3.1"
solana-zk-sdk = "=7.0.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
